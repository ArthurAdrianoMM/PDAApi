# Publishes a version tag (v1.2.3, or v1.2.3-beta.0 for a pre-release) to npm and
# to a GitHub Release with the Claude Desktop bundle. How to cut one: docs/RELEASING.md.
#
# npm trusts this workflow by name (Trusted Publishing, set up once on npmjs.com),
# so no npm token is stored anywhere, and npm attaches a provenance statement
# linking the package to this repository and this run.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing and provenance
    env:
      # A version with a hyphen is a pre-release: npm tag "next", so `@latest` users never get it.
      DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm >= 11.5.1, which Trusted Publishing needs
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no shared cache in a job that can publish

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json. Release with 'npm version', see docs/RELEASING.md."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Everything is built and checked before anything is published.
      - name: Build the package and the Claude Desktop bundle
        run: npm run pack:mcpb

      - name: Publish to npm
        run: |
          # Lets a failed run be re-run after npm already took this version.
          if [ "$(npm view "$NAME@$VERSION" version 2> /dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm."
          else
            # Tests and build already ran above; skip prepublishOnly.
            npm publish --tag "$DIST_TAG" --ignore-scripts
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [ "$DIST_TAG" = next ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$NAME-$VERSION.mcpb" "${flags[@]}"
